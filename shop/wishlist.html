<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QHOF — Wishlist</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

  <div class="app-window">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="logo-container">
        <div class="logo">QHOF</div>
        <button class="close-sidebar-btn" id="closeSidebarBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="sidebar-divider"></div>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="library.html" class="nav-link"><i class="fa-solid fa-layer-group"></i><span>Library</span></a>
        <a href="store.html" class="nav-link"><i class="fa-solid fa-store"></i><span>Store</span></a>
        <a href="wishlist.html" class="nav-link active"><i class="fa-solid fa-heart"></i><span>Wishlist</span></a>
        <a href="bootstrap.html" class="nav-link bootstrap-link"><i class="fa-brands fa-bootstrap"></i><span>Bootstrap Page</span></a>
      </nav>

      <div class="sidebar-divider"></div>
      <nav class="nav-menu">
        <a href="#" class="nav-link"><i class="fa-solid fa-percent"></i><span>Discount</span></a>
        <a href="#" class="nav-link"><i class="fa-solid fa-wallet"></i><span>Wallet | $20.00</span></a>
      </nav>
      <div class="sidebar-divider"></div>
      <div class="sidebar-footer">
        <a href="#" class="nav-link"><i class="fa-solid fa-comments"></i><span>Friends & Chat</span></a>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <button class="mobile-menu-toggle" id="mobileMenuToggle"><i class="fa-solid fa-bars"></i></button>
        <div class="search-container">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" placeholder="Search wishlist..." class="search-input">
        </div>
        <div class="user-actions">
          <button class="btn-signin" id="openAuthModalBtn"><i class="fa-solid fa-right-to-bracket"></i><span>Sign In</span></button>
          <button class="action-btn" aria-label="Cart"></button>
          <button class="action-btn" aria-label="Notifications"><i class="fa-solid fa-bell"></i></button>
          <div class="user-avatar"></div>
        </div>
      </header>

      <section class="wishlist-header">
        <h1 class="page-main-title">MY WISHLIST ❤️</h1>
        <p class="section-subtitle">2 games saved for later</p>
      </section>

      <!-- Список бажаного -->
      <section class="wishlist-list">
        
        <div class="wishlist-item-card">
          <img src="assets/images/spider.png" alt="Spider-Man" class="wishlist-thumb">
          <div class="wishlist-info">
            <h3>Spider-Man: Miles Morales</h3>
            <div class="tags-row">
              <span class="tag">Action</span>
              <span class="tag">Open World</span>
            </div>
          </div>
          <div class="wishlist-price-block">
            <span class="wishlist-price">$49.99</span>
            <button class="btn-add-cart" onclick="window.globalCart.addItem('spider')">
              <i class="fa-solid fa-cart-plus"></i> Add to Cart
            </button>
          </div>
        </div>

        <div class="wishlist-item-card">
          <img src="assets/images/litn.png" alt="Little Nightmares II" class="wishlist-thumb">
          <div class="wishlist-info">
            <h3>Little Nightmares II</h3>
            <div class="tags-row">
              <span class="tag">Horror</span>
              <span class="tag">Puzzle</span>
            </div>
          </div>
          <div class="wishlist-price-block">
            <span class="wishlist-price">$29.99</span>
            <button class="btn-add-cart" onclick="window.globalCart.addItem('litn')">
              <i class="fa-solid fa-cart-plus"></i> Add to Cart
            </button>
          </div>
        </div>

      </section>

    </main>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
